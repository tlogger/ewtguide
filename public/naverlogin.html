<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네이버 로그인 처리 중 - 동서트레일 가이드</title>
  <script type="text/javascript" src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js" charset="utf-8"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #10b981;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">네이버 로그인 정보를 인증하는 중입니다...</div>
  <div class="desc">잠시만 기다려주세요. 메인 화면으로 자동 이동합니다.</div>

  <script type="text/javascript">
    (function() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';

      var naverLogin = new naver.LoginWithNaverId({
        clientId: "ZlO4zT_XXNDHb24LQL5u",
        callbackUrl: window.location.href.split('#')[0].split('?')[0],
        isPopup: false,
        callbackHandle: true
      });

      naverLogin.init();

      naverLogin.getLoginStatus(function (status) {
        if (status) {
          try {
            var email = naverLogin.user.getEmail() || '';
            var name = naverLogin.user.getName() || naverLogin.user.getNickName() || '네이버 트레커';
            var id = naverLogin.user.getId() || ('naver_' + Date.now());
            var profileImage = naverLogin.user.getProfileImage() || '';
            var accessToken = (naverLogin.accessToken && naverLogin.accessToken.accessToken) || '';

            var authPayload = {
              provider: 'naver',
              id: id,
              email: email,
              name: name,
              profile_image: profileImage,
              access_token: accessToken,
              timestamp: Date.now()
            };

            localStorage.setItem('ewtguide_naver_auth_payload', JSON.stringify(authPayload));
          } catch (e) {
            console.error('Failed to parse naver user:', e);
          }
        }

        var basePath = window.location.pathname.replace(/\/naverlogin(\/.*)?$/, '/');
        window.location.replace(basePath);
      });

      setTimeout(function() {
        if (!localStorage.getItem('ewtguide_naver_auth_payload')) {
          var match = hash.match(/access_token=([^&]+)/);
          if (match && match[1]) {
            localStorage.setItem('ewtguide_naver_auth_payload', JSON.stringify({
              provider: 'naver',
              id: 'naver_' + Date.now(),
              name: '네이버 트레커',
              access_token: match[1],
              timestamp: Date.now()
            }));
          }
        }
        var basePath = window.location.pathname.replace(/\/naverlogin(\/.*)?$/, '/');
        window.location.replace(basePath);
      }, 2500);
    })();
  </script>
</body>
</html>
