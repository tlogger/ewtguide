<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네이버 로그인 처리 중 - 동서트레일 가이드</title>
  <script type="text/javascript" src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js" charset="utf-8"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #10b981;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">네이버 로그인 정보를 인증하는 중입니다...</div>
  <div class="desc">잠시만 기다려주세요. 메인 화면으로 자동 이동합니다.</div>

  <script type="text/javascript">
    (function() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';

      var matchToken = hash.match(/access_token=([^&]+)/);
      var accessToken = matchToken ? matchToken[1] : '';

      var basePath = window.location.pathname.replace(/\/naverlogin(\/.*)?$/, '/');

      // 1. URL 해시에서 access_token 즉시 보전
      if (accessToken) {
        var basePayload = {
          provider: 'naver',
          id: 'naver_' + Date.now(),
          name: '네이버 회원',
          access_token: accessToken,
          timestamp: Date.now()
        };
        localStorage.setItem('ewtguide_naver_auth_payload', JSON.stringify(basePayload));
      }

      var redirectHandler = function() {
        window.location.replace(basePath);
      };

      try {
        var naverLogin = new naver.LoginWithNaverId({
          clientId: "ZlO4zT_XXNDHb24LQL5u",
          callbackUrl: "https://tlogger.github.io/ewtguide/naverlogin",
          isPopup: false,
          callbackHandle: true
        });

        naverLogin.init();

        naverLogin.getLoginStatus(function (status) {
          if (status && naverLogin.user) {
            try {
              var email = naverLogin.user.getEmail() || '';
              var name = naverLogin.user.getName() || naverLogin.user.getNickName() || email || '네이버 회원';
              var id = naverLogin.user.getId() || ('naver_' + Date.now());
              var profileImage = naverLogin.user.getProfileImage() || '';
              var token = (naverLogin.accessToken && naverLogin.accessToken.accessToken) || accessToken;

              var authPayload = {
                provider: 'naver',
                id: id,
                email: email,
                name: name,
                profile_image: profileImage,
                access_token: token,
                timestamp: Date.now()
              };

              localStorage.setItem('ewtguide_naver_auth_payload', JSON.stringify(authPayload));
            } catch (err) {
              console.error('Naver profile error:', err);
            }
          }
          redirectHandler();
        });
      } catch (e) {
        console.warn('Naver SDK init notice:', e);
        setTimeout(redirectHandler, 500);
      }

      setTimeout(redirectHandler, 1800);
    })();
  </script>
</body>
</html>
