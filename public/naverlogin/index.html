<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네이버 로그인 처리 중 - 동서트레일 가이드</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #10b981;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">네이버 로그인 정보를 인증하는 중입니다...</div>
  <div class="desc">잠시만 기다려주세요. 메인 화면으로 자동 이동합니다.</div>

  <script type="text/javascript">
    (function() {
      // 1. 해시(#) 또는 쿼리(?)에서 access_token 파싱
      var hash = window.location.hash || '';
      var search = window.location.search || '';

      var matchToken = hash.match(/access_token=([^&]+)/) || search.match(/access_token=([^&]+)/);
      var accessToken = matchToken ? decodeURIComponent(matchToken[1]) : '';

      var basePath = window.location.pathname.replace(/\/naverlogin(\.html|\/.*)?$/, '/');
      var cleanTarget = window.location.origin + basePath;

      var redirected = false;
      function redirectBack() {
        if (redirected) return;
        redirected = true;
        window.location.replace(cleanTarget);
      }

      // access_token이 없으면 바로 메인으로 복귀
      if (!accessToken) {
        redirectBack();
        return;
      }

      // 모바일 앱 여부 판단
      var isApp = false;
      try {
        var stateMatch = (hash.match(/state=([^&]+)/) || search.match(/state=([^&]+)/));
        if (stateMatch) {
          var stateObj = JSON.parse(decodeURIComponent(stateMatch[1]));
          if (stateObj && stateObj.isApp) isApp = true;
        }
      } catch(e) {}

      // 2. 기본 세션 페이로드 준비
      var fallbackPayload = {
        provider: 'naver',
        id: 'naver_' + Date.now(),
        name: '네이버 트레커',
        email: 'naver_user@ewtguide.kr',
        access_token: accessToken,
        timestamp: Date.now()
      };
      localStorage.setItem('ewtguide_naver_auth_payload', JSON.stringify(fallbackPayload));

      // 3. 네이버 공식 OpenAPI(nid/me) JSONP를 통해 실제 사용자 프로필 조회
      var callbackName = '_naver_user_profile_' + Math.floor(Math.random() * 1000000);
      var script = document.createElement('script');
      var timeout = setTimeout(function() {
        cleanup();
        if (isApp) {
          window.location.href = 'com.ewtguide.app://oauth?provider=naver&payload=' + encodeURIComponent(JSON.stringify(fallbackPayload));
          setTimeout(redirectBack, 2500);
        } else {
          redirectBack();
        }
      }, 1800);

      function cleanup() {
        clearTimeout(timeout);
        try {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        } catch (e) {}
      }

      window[callbackName] = function(data) {
        cleanup();
        try {
          if (data && data.response) {
            var profile = data.response;
            var realId = profile.id ? ('naver_' + profile.id) : fallbackPayload.id;
            var realEmail = profile.email || '';
            var realName = profile.nickname || profile.name || (realEmail ? realEmail.split('@')[0] : '') || '네이버 트레커';
            var realPhoto = profile.profile_image || '';

            var successPayload = {
              provider: 'naver',
              id: realId,
              name: realName,
              email: realEmail || (realId + '@naver.com'),
              profile_image: realPhoto,
              access_token: accessToken,
              timestamp: Date.now()
            };
            localStorage.setItem('ewtguide_naver_auth_payload', JSON.stringify(successPayload));

            if (isApp) {
              window.location.href = 'com.ewtguide.app://oauth?provider=naver&payload=' + encodeURIComponent(JSON.stringify(successPayload));
              setTimeout(redirectBack, 2500);
              return;
            }
          }
        } catch (err) {
          console.warn('Profile parse notice:', err);
        }

        if (isApp) {
          window.location.href = 'com.ewtguide.app://oauth?provider=naver&payload=' + encodeURIComponent(JSON.stringify(fallbackPayload));
          setTimeout(redirectBack, 2500);
        } else {
          redirectBack();
        }
      };

      script.onerror = function() {
        cleanup();
        if (isApp) {
          window.location.href = 'com.ewtguide.app://oauth?provider=naver&payload=' + encodeURIComponent(JSON.stringify(fallbackPayload));
          setTimeout(redirectBack, 2500);
        } else {
          redirectBack();
        }
      };

      script.src = 'https://openapi.naver.com/v1/nid/me?oauth_token=' + encodeURIComponent(accessToken) + '&callback=' + callbackName;
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
