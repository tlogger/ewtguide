<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="동서트레일 32개 구간 가이드 - 공식 노선, 고도 프로필, 편의시설 및 완주 인증" />
    <title>동서트레일 가이드 | ewtguide</title>
    <!-- Pretendard web font for crisp senior-friendly typography -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          var query = hash.substring(1) || search.substring(1);
          if (query.indexOf('state=') !== -1) {
            var params = new URLSearchParams(query);
            var rawState = params.get('state');
            if (rawState) {
              var stateObj = JSON.parse(decodeURIComponent(rawState));
              if (stateObj && stateObj.isApp) {
                window.location.href = 'com.ewtguide.app://oauth?' + query;
              }
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased font-sans select-none sm:select-auto">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
